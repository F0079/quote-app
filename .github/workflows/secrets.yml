name: secrets

# Tripwire for secrets in incoming commits. It scans the commits of the push or
# pull request, so it catches a leak early enough to rotate the credential.
# It is NOT a history audit: a secret already in the repo or its history cannot
# be fixed by a scan — rotate the secret and rewrite the history.
# Personal information (paths, emails) is guarded locally by .githooks/pre-commit.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
